* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a1a; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; }

.controls {
  background: #111; border-bottom: 1px solid #333;
  padding: 18px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 100;
}
.controls h1 { font-size: 16px; font-weight: 700; color: #D4A72C; flex: 1; min-width: 160px; }
.ctrl-grp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctrl-label { font-size: 12px; color: #777; }
select, input[type=text] {
  background: #222; border: 1px solid #444; color: #e0e0e0;
  border-radius: 7px; padding: 7px 12px; font-size: 13px; font-family: inherit; outline: none;
}
select:focus, input:focus { border-color: #D4A72C; }
.btn {
  background: #D4A72C; color: #000; border: none; border-radius: 8px;
  padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: background .18s;
}
.btn:hover { background: #F0D980; }
.btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }
.btn-outline:hover { border-color: #D4A72C; color: #D4A72C; }

.settings {
  background: #0f0f0f; border: 1px solid #333; border-radius: 10px;
  padding: 16px 24px; margin: 16px 24px;
}
.settings-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.settings-row:last-child { margin-bottom: 0; }
.settings-label { font-size: 12px; color: #777; min-width: 80px; }

.preview-box {
  margin: 24px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px;
}
.badge-item {
  background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px;
  cursor: pointer; transition: all .2s;
}
.badge-item:hover { border-color: #D4A72C; background: #222; }
.badge-item.selected { border-color: #D4A72C; background: rgba(212, 167, 44, 0.1); }
.badge-item input[type=checkbox] { margin-right: 8px; cursor: pointer; }
.badge-name { font-weight: 600; color: #e0e0e0; }
.badge-full { font-size: 12px; color: #999; }
.badge-role { font-size: 11px; color: #777; margin-top: 4px; }

.count-bar { padding: 8px 24px; font-size: 12px; color: #666; }
.note { font-size: 12px; color: #666; margin: 16px 24px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; border-left: 2px solid #D4A72C; }
</style>

let selectedIndices = new Set();

function updatePreview() {
  const outlet = document.getElementById('filterOutlet').value;
  const search = document.getElementById('searchInput').value.toLowerCase();

  let filtered = PARTICIPANTS.map((p, i) => ({ p, i }));
  if (outlet) filtered = filtered.filter(({p}) => p.outlet === outlet);
  if (search) filtered = filtered.filter(({p}) =>
    p.name.toLowerCase().includes(search) || p.full.toLowerCase().includes(search)
  );

  const box = document.getElementById('previewBox');
  box.innerHTML = filtered.map(({p, i}) => {
    const pid = 'P' + String(i + 1).padStart(3, '0');
    const checked = selectedIndices.has(i);
    return `
      <label class="badge-item ${checked ? 'selected' : ''}">
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSelect(${i})">
        <div class="badge-name">${p.name}</div>
        <div class="badge-full">${p.full}</div>
        <div class="badge-role">${p.role} · ${p.outlet}</div>
        <div style="font-size:11px;color:#555;margin-top:4px;">${pid}</div>
      </label>
    `;
  }).join('');

  updateCount();
}

function toggleSelect(idx) {
  if (selectedIndices.has(idx)) {
    selectedIndices.delete(idx);
  } else {
    selectedIndices.add(idx);
  }
  updatePreview();
}

function selectAll() {
  const outlet = document.getElementById('filterOutlet').value;
  const search = document.getElementById('searchInput').value.toLowerCase();

  PARTICIPANTS.forEach((p, i) => {
    let include = true;
    if (outlet && p.outlet !== outlet) include = false;
    if (search && !p.name.toLowerCase().includes(search) && !p.full.toLowerCase().includes(search)) include = false;
    if (include) selectedIndices.add(i);
  });
  updatePreview();
}

function deselectAll() {
  selectedIndices.clear();
  updatePreview();
}

function updateCount() {
  document.getElementById('countBar').textContent = `${selectedIndices.size} badge${selectedIndices.size !== 1 ? 's' : ''} selected`;
}

        display: flex; flex-direction: column;
        background: #fff; color: #000;

        box-sizing: border-box;
      ">
        <!-- Top: FOL 2026 -->
        <div style="flex: 0 0 20%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid #333;">
          <div style="font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 3px;">F O L</div>
          <div style="font-size: 10px; color: #D4A72C; margin-top: 2px; letter-spacing: 1px;">— 2 0 2 6 —</div>
          <div style="font-size: 16px; color: #D4A72C; margin-top: 1px;">✦</div>
        </div>

        <!-- Middle: Content -->
        <div style="flex: 1; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #fff;">
          <div style="font-size: 9px; background: #000; color: #fff; padding: 3px 8px; font-weight: 600; margin-bottom: 4px; border-radius: 3px;">${p.role}</div>
          <div style="font-size: 14px; font-weight: 600; color: #000; margin-bottom: 1px; line-height: 1.1;">${p.name}</div>
          <div style="font-size: 9px; color: #777; margin-bottom: 4px; line-height: 1.1;">${p.full}</div>
          <div style="width: 50px; height: 50px; margin: 3px 0; background: #f0f0f0; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd;">
            <svg class="qr-${pid}" width="48" height="48"></svg>
          </div>
          <div style="font-size: 8px; color: #999; margin-top: 3px;">${pid} · ${p.outlet}</div>
        </div>

        <!-- Bottom: Tagline -->
        <div style="flex: 0 0 16%; background: #000; display: flex; align-items: center; justify-content: center; border-top: 1px solid #333;">
          <div style="font-size: 8px; color: #888; letter-spacing: 1px; text-align: center;">— BREAK TODAY · BUILD TOMORROW —</div>
        </div>
      </div>
    `;
  });

  element.innerHTML = html;
  element.style.display = 'none';
  document.body.appendChild(element);

  // Generate QR codes
  let qrCount = 0;
  badges.forEach(idx => {
    const pid = 'P' + String(idx + 1).padStart(3, '0');
    const badge = element.querySelector(`[data-pid="${pid}"]`);
    if (badge) {
      const url = badge.getAttribute('data-url');
      const svg = badge.querySelector(`.qr-${pid}`);
      QRCode.toDataURL(url, { width: 48, margin: 0, color: { dark: '#000', light: '#fff' } }, (err, dataUrl) => {
        if (!err && svg) {
          svg.outerHTML = `<img src="${dataUrl}" width="48" height="48" style="display:block;">`;
        }
        qrCount++;
        if (qrCount === badges.length) {
          setTimeout(() => generatePDFFromElement(element, btn), 300);
        }
      });
    }
  });
}

function generatePDFFromElement(element, btn) {
  const opt = {
    margin: 0,
    filename: 'FOL2026-Badges.pdf',
    image: { type: 'png', quality: 0.98 },
    html2canvas: { scale: 3, useCORS: true, backgroundColor: '#fff' },
    jsPDF: { format: [50, 80], unit: 'mm', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save().finally(() => {
    element.remove();
    btn.disabled = false;
    btn.textContent = '📥 Generate PDF (50mm×80mm)';
  });
}

updatePreview();
</script>
</body>
