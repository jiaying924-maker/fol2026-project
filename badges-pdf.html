html, body { width: 100%; height: 100%; }
body { font-family: 'Inter', sans-serif; background: #fff; }

.badge-container {
  width: 50mm;
  height: 80mm;
  page-break-after: always;
  page-break-inside: avoid;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  font-family: 'Cormorant Garamond', serif;

}

.badge-top {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.5mm 0;
}

.badge-fol {

  font-weight: 700;

  line-height: 1;
}

.badge-year {

  margin-top: 0.5mm;
}

.badge-star {
  color: #D4A72C;
  font-size: 4pt;
  margin-top: 0.5mm;
}

.badge-middle {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3mm 4mm;
  background: #fff;
  gap: 1mm;
  min-height: 0;
}

.badge-role {
  font-family: 'Inter', sans-serif;
  font-size: 8pt;
  font-weight: 600;
  color: #000;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  text-align: center;
  flex-shrink: 0;
}

.badge-name {
  font-size: 12pt;
  font-weight: 600;
  color: #000;
  text-align: center;
  line-height: 1.05;

.badge-full-name {

  color: #000;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  letter-spacing: 0.2px;
  text-align: center;
  flex-shrink: 0;
}

.badge-qr {
  width: 3.5mm;
  height: 3.5mm;
  margin: 0.3mm auto;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.badge-qr canvas {
  width: 3.5mm !important;
  height: 3.5mm !important;
  display: block;
  margin: 0 !important;
}

.badge-id {
  font-size: 5pt;
  color: #000;
  font-family: 'Inter', monospace;
  font-weight: 500;
  letter-spacing: 0.3px;
  text-align: center;
  flex-shrink: 0;
}

.badge-bottom {
  background: #000;
  flex: 0 0 20%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2mm 3mm;
}

.badge-tagline {

  color: #fff;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  line-height: 1.25;
  text-align: center;
}

@media print {

  .badge-container { margin: 0; padding: 0; }
