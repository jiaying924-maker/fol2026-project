async function deleteRecentMessages() {
  const hours = parseInt(document.getElementById('hours').value);
  const cutoffTime = Date.now() - (hours * 60 * 60 * 1000);

  const confirm = window.confirm(`🗑️ Delete messages from the last ${hours} hour(s) from ALL participants?\n\nThis will affect ~${PARTICIPANTS.length} participants.`);
  if (!confirm) {
    log('❌ Cancelled');
    return;
  }

  log(`🗑️ Scanning all participants for messages older than ${new Date(cutoffTime).toLocaleString()}...\n`);

  let deletedCount = 0;
  let processedCount = 0;

  for (let i = 0; i < PARTICIPANTS.length; i++) {
    const pid = 'P' + String(i + 1).padStart(3, '0');

    try {
      const doc = await db.collection('participants').doc(pid).get();
      if (!doc.exists || !doc.data().messages) continue;

      const messages = doc.data().messages || [];
      const toKeep = messages.filter(msg => {
        const msgTime = msg.time?.toMillis?.() || msg.time?.seconds * 1000 || 0;
        return msgTime < cutoffTime; // Keep old messages
      });

      if (toKeep.length < messages.length) {
        const deleted = messages.length - toKeep.length;
        deletedCount += deleted;

        if (toKeep.length === 0) {
          await db.collection('participants').doc(pid).update({
            messages: firebase.firestore.FieldValue.delete()
          });
        } else {
          await db.collection('participants').doc(pid).update({
            messages: toKeep
          });
        }

        log(`  ✅ ${pid}: deleted ${deleted} recent message(s)`);
      }

      processedCount++;
    } catch (e) {
      // Skip errors
    }
  }

  log(`\n<span class="success">✅ Done! Processed ${processedCount} participants, deleted ${deletedCount} recent messages.</span>`);
}

function log(text) {
  const out = document.getElementById('output');
  out.innerHTML += text + '\n';
}
