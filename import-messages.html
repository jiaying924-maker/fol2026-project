function findParticipantId(name) {
  const cleanName = name.trim().toUpperCase().replace(/^(CL|BM|GL|GY|RU|MA|SU|JB|PC|KL|SS2|PG|HQ|VIP)\s*-\s*/, '');
  for (let i = 0; i < PARTICIPANTS.length; i++) {
    if (PARTICIPANTS[i].name.toUpperCase() === cleanName || PARTICIPANTS[i].full.toUpperCase() === cleanName) {
      return 'P' + String(i + 1).padStart(3, '0');
    }
  }
  return null;
}

async function importMessages() {
  const csv = document.getElementById('csvData').value.trim();
  if (!csv) { alert('Please paste CSV data'); return; }

  const lines = csv.split('\n').filter(l => l.trim());
  const messages = [];

  // Parse CSV
  for (const line of lines) {
    const parts = line.split('\t').map(p => p.trim()).filter(p => p);
    if (parts.length < 3) continue;

    const from = parts[parts.length - 2]; // Master
    const to = parts[parts.length - 3];   // Angel
    const text = parts.slice(3).join(' '); // Message (everything after first 3 columns)

    if (!text) continue;

    messages.push({ to, from, text });
  }

  if (messages.length === 0) { alert('No messages found'); return; }

  showStatus(`Found ${messages.length} messages. Starting import...`, 'info');
  document.getElementById('progress').style.display = 'block';

  let imported = 0;
  let failed = 0;

  for (let i = 0; i < messages.length; i++) {
    const { to, from, text } = messages[i];
    const pid = findParticipantId(to);

    if (!pid) {
      console.warn(`❌ Could not find participant: ${to}`);
      failed++;
    } else {
      try {
        const msg = { from, text, time: firebase.firestore.Timestamp.now() };
        await db.collection('participants').doc(pid).update({
          messages: firebase.firestore.FieldValue.arrayUnion(msg)
        });
        imported++;
      } catch (e) {
        console.error(`Error importing message for ${to}:`, e);
        failed++;
      }
    }

    // Update progress
    const percent = Math.round((i + 1) / messages.length * 100);
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').textContent = `${i + 1} / ${messages.length}`;
  }

  showStatus(`✅ Import complete! ${imported} messages imported, ${failed} failed`, 'success');
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}
