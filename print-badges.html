<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOL 2026 · Print Badges</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a1a; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; padding: 20px; }
.controls { background: #111; border: 1px solid #333; padding: 18px 24px; border-radius: 8px; margin-bottom: 20px; }
.controls h2 { font-size: 16px; color: #D4A72C; margin-bottom: 12px; }
select, input { background: #222; border: 1px solid #444; color: #e0e0e0; border-radius: 7px; padding: 7px 12px; font-size: 13px; font-family: inherit; margin: 5px; }
select:focus, input:focus { border-color: #D4A72C; }
button { background: #D4A72C; color: #000; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; margin: 5px; }
button:hover { background: #F0D980; }
#count { margin-top: 10px; font-size: 12px; color: #777; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px 0;
}

.badge {
  width: 220px;
  aspect-ratio: 220 / 346;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.07);
  display: flex;
  flex-direction: column;
  background: #fff;
  font-family: 'Cormorant Garamond', serif;
  page-break-inside: avoid;
}

.badge-top {
  background: #000;
  flex: 0 0 20%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 0 3px;
}
.badge-fol { font-size: 32px; font-weight: 700; letter-spacing: 10px; color: #fff; line-height: 1; }
.badge-year-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.badge-year-line { flex: 1; height: 1px; background: rgba(255,255,255,0.3); width: 18px; }
.badge-year { font-size: 8px; letter-spacing: 5px; color: #ccc; font-family: 'Inter', sans-serif; font-weight: 400; }
.badge-star { color: #D4A72C; font-size: 6px; margin-top: 3px; }

.badge-mid {
  flex: 1;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 12px 6px;
  gap: 3px;
}
.badge-role-pill {
  background: #111;
  color: #fff;
  font-size: 7.5px;
  letter-spacing: 1.5px;
  padding: 3px 10px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  text-transform: uppercase;
  border-radius: 2px;
  margin-bottom: 2px;
}
.badge-name { font-size: 18px; font-weight: 700; color: #000; text-align: center; letter-spacing: 0.3px; line-height: 1.1; }
.badge-full { font-size: 7.5px; color: #888; letter-spacing: 1px; font-family: 'Inter', sans-serif; text-transform: uppercase; margin-top: 1px; }
.badge-divider-line { display: flex; align-items: center; gap: 4px; margin: 4px 0; }
.badge-divider-line::before, .badge-divider-line::after { content:''; flex:1; height:1px; background:#ddd; }
.badge-divider-dot { color: #ccc; font-size: 5px; }
.badge-qr { width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
.badge-qr canvas, .badge-qr img { width: 90px !important; height: 90px !important; }
.badge-id { font-size: 7px; color: #999; letter-spacing: 2px; font-family: 'Inter', monospace; margin-top: 1px; }

.badge-bot {
  background: #000;
  flex: 0 0 12%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.badge-bot-line { flex: 1; height: 1px; background: rgba(255,255,255,0.2); max-width: 20px; }
.badge-theme { font-size: 8px; letter-spacing: 3px; color: #fff; font-family: 'Inter', sans-serif; font-weight: 600; text-transform: uppercase; }

@media print {
  body { background: #fff; color: #000; padding: 0; margin: 0; }
  .controls { display: none; }
  .grid {
    grid-template-columns: repeat(auto-fit, minmax(54mm, 1fr));
    gap: 0;
    padding: 0;
  }
  .badge {
    width: 54mm;
    height: 86mm;
    aspect-ratio: auto;
    box-shadow: none;
    border: 0.5pt solid #ddd;
    border-radius: 3mm;
    margin: 0;
  }
  .badge-top { background: #000 !important; }
  .badge-mid { background: #fff !important; }
  .badge-bot { background: #000 !important; }
  .badge-fol { color: #fff !important; }
  .badge-year-line { background: rgba(255,255,255,0.3) !important; }
  .badge-year { color: #ccc !important; }
  .badge-star { color: #D4A72C !important; }
  .badge-role-pill { background: #111 !important; color: #fff !important; }
  .badge-name { color: #000 !important; }
  .badge-full { color: #888 !important; }
  .badge-id { color: #999 !important; }
  .badge-bot-line { background: rgba(255,255,255,0.2) !important; }
  .badge-theme { color: #fff !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>

function buildBadge(p, idx) {
  const pid = 'P' + String(idx + 1).padStart(3, '0');
  return `
    <div class="badge">
      <div class="badge-top">
        <div class="badge-fol">F O L</div>
        <div class="badge-year-row">
          <div class="badge-year-line"></div>
          <div class="badge-year">2 0 2 6</div>
          <div class="badge-year-line"></div>
        </div>
        <div class="badge-star">✦</div>
      </div>
      <div class="badge-mid">
        <div class="badge-role-pill">${p.role}</div>
        <div class="badge-name">${p.name}</div>
        <div class="badge-full">${p.full}</div>
        <div class="badge-divider-line"><span class="badge-divider-dot">✦</span></div>
        <div class="badge-qr" id="qr-${pid}"></div>
        <div class="badge-id">${pid} · ${p.outlet}</div>
      </div>
      <div class="badge-bot">
        <div class="badge-bot-line"></div>
        <div class="badge-theme">— BREAK TODAY · BUILD TOMORROW —</div>
        <div class="badge-bot-line"></div>
      </div>
    </div>
  `;
}

function generateQR(pid, url) {
  const el = document.getElementById('qr-' + pid);
  if (!el || el.children.length > 0) return;
  try {
    new QRCode(el, {
      text: url,
      width: 90,
      height: 90,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {}
}

function update() {
  const outlet = document.getElementById('outlet').value;
  const search = document.getElementById('search').value.toLowerCase();

  let list = PARTICIPANTS;
  if (outlet) list = list.filter(p => p.outlet === outlet);
  if (search) list = list.filter(p => p.name.toLowerCase().includes(search) || p.full.toLowerCase().includes(search));

  let html = '';
  list.forEach(p => {
    const idx = PARTICIPANTS.indexOf(p);
    html += buildBadge(p, idx);
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = html;

  // Generate QR codes
  list.forEach(p => {
    const idx = PARTICIPANTS.indexOf(p);
    const pid = 'P' + String(idx + 1).padStart(3, '0');
    const url = 'https://jiaying924-maker.github.io/fol2026-project/?id=' + pid;
    generateQR(pid, url);
  });

  updateCount();
}

function selectAll() {
  const outlet = document.getElementById('outlet').value;
  const search = document.getElementById('search').value.toLowerCase();
  PARTICIPANTS.forEach((p, i) => {
    let match = true;
    if (outlet && p.outlet !== outlet) match = false;
    if (search && !p.name.toLowerCase().includes(search) && !p.full.toLowerCase().includes(search)) match = false;
    if (match) selected.add(i);
  });
}

function deselectAll() {
  selected.clear();
}

function updateCount() {
  document.getElementById('count').textContent = `Showing ${PARTICIPANTS.length} badges`;
}

update();
</script>
</body>
</html>
