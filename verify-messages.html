<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Messages in Firestore</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; background: #0a0e27; color: #0f0; padding: 20px; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { color: #D4A72C; margin-bottom: 20px; }
input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; border-radius: 4px; width: 200px; }
button { background: #D4A72C; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-left: 10px; }
#output { background: #111; color: #0f0; padding: 20px; border-radius: 4px; margin-top: 20px; white-space: pre-wrap; font-size: 12px; max-height: 600px; overflow-y: auto; }
</style>
</head>
<body>

<div class="container">
  <h1>🔍 Verify Messages in Firestore</h1>
  <div>
    <input type="text" id="pidInput" placeholder="Enter participant ID (e.g., P008)" value="P008">
    <button onclick="checkMessages()">Check Messages</button>
  </div>
  <div id="output"></div>
</div>

<script>
const FB_CONFIG = {
  apiKey:            "AIzaSyBXkCvP9XxS1n_DP_0dDKlk2eFfB6-hVHo",
  authDomain:        "fol2026.firebaseapp.com",
  projectId:         "fol2026",
  storageBucket:     "fol2026.firebasestorage.app",
  messagingSenderId: "766849872975",
  appId:             "1:766849872975:web:25e03f8e1c3b2f1a3b7c9e"
};

firebase.initializeApp(FB_CONFIG);
const db = firebase.firestore();

async function checkMessages() {
  const pid = document.getElementById('pidInput').value.trim().toUpperCase();
  if (!pid.startsWith('P')) {
    log('❌ Invalid ID format. Use P### (e.g., P008)');
    return;
  }

  log(`🔍 Checking participant: ${pid}...\n`);

  try {
    const doc = await db.collection('participants').doc(pid).get();

    if (!doc.exists) {
      log(`❌ Document doesn't exist: ${pid}`);
      return;
    }

    const data = doc.data();
    log(`✅ Document found!\n`);
    log(`Full data:\n${JSON.stringify(data, null, 2)}\n`);

    if (!data.messages) {
      log(`❌ No messages field found!`);
      return;
    }

    if (!Array.isArray(data.messages)) {
      log(`❌ Messages is not an array! Type: ${typeof data.messages}`);
      return;
    }

    log(`✅ Messages array found with ${data.messages.length} message(s):\n`);
    data.messages.forEach((msg, i) => {
      log(`\n[${i}] From: ${msg.from || '(no from)'}`);
      log(`    Text: ${(msg.text || '(no text)').substring(0, 100)}...`);
      log(`    Time: ${msg.time || '(no time)'}`);
    });

  } catch (e) {
    log(`❌ Error: ${e.message}`);
  }
}

function log(text) {
  const out = document.getElementById('output');
  out.textContent += text + '\n';
}
</script>

</body>
</html>
